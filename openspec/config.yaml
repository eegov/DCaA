schema: spec-driven

context: |
  Учебный проект, вариант 2 «Учёт студентов». Требования преподавателя: docs/labs-requirements.md.
  Лабораторные 1–7 развивают одну систему. Делаем только текущую лабораторную,
  функции следующих (отчёты, шлюз, очередь, JWT) заранее не добавляем.
  Стек: Java 25, Spring Boot, PostgreSQL, Liquibase (SQL changesets), springdoc-openapi, Docker Compose.
  Артефакты пишем на русском; заголовки OpenSpec и ключевые слова SHALL/WHEN/THEN на английском.

rules:
  proposal:
    - Отдельным разделом перечислять, что вне рамок изменения.
    - "Рамки, которые пользователь задал в ответ на вопрос агента, помечать «Решение пользователя: <вопрос> → <ответ>»."
  design:
    - "Решение, которое пользователь принял в ответ на вопрос агента, помечать в Decisions «Решение пользователя: <вопрос> → <ответ>». Решения без пометки агент принял сам как допущение, их пользователь может оспорить."
  specs:
    - Каждый сценарий проверяется интеграционным тестом или ручной проверкой, записанной в tasks.md.
  tasks:
    - "Последние задачи изменения: ревью в чистом контексте (скилл code-review) и ./mvnw verify."
